<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Cortex Mobile</title>

<!--
  Cortex mobile companion — web client (M4 / mobile-first).

  EMBEDDED in the Cortex binary and served by the bridge at `GET /`. Open it from
  any browser — including the phone's — by visiting the bridge URL; no app
  install. Locally: http://127.0.0.1:<port>/ ; from the phone over Tailscale:
  http://<this-machine's-100.x>:<port>/?token=<secret>. (A copy lives under
  tools/mobile-bridge-tester/ for file:// use; this embedded one is canonical.)

  In DEBUG builds the bridge re-reads this file from disk on every request, so
  edits show up with a plain browser refresh — no rebuild — while iterating on
  the phone. Release builds serve the copy baked in at compile time.

  Layout is mobile-first: an off-canvas drawer holds the connection fields + the
  Window>Tab>Pane tree; tapping a pane mirrors it full-screen. A bottom soft-key
  bar sends the keys a phone keyboard lacks (Esc/Tab/arrows/Ctrl-C, /clear,
  /exit). On wide screens the drawer becomes a static sidebar.

  Fidelity: the Snapshot frame carries the desktop pane's cols/rows; we resize
  xterm to match so absolute cursor moves and alt-screen TUIs (Claude prompts)
  land correctly, then let the user zoom/fit/pan the desktop-sized grid (v1
  doesn't resize the PTY). There is no local echo — characters appear when the
  PTY echoes them back, like any remote terminal. xterm.js is loaded from a CDN.
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>

<style>
  :root {
    --bg: #0d0f12;
    --panel: #14171c;
    --panel-2: #1b1f26;
    --border: #2a2f38;
    --text: #c8ccd4;
    --dim: #7c828d;
    --accent: #6fb3ff;
    /* --proj is the *current pane's* saved Cortex project color. JS overwrites it
       on every selection/poll (falling back to --accent when no pane/project), and
       the command soft-keys + Send button tint themselves from it. */
    --proj: #6fb3ff;
    --ok: #57c08a;
    --warn: #e0b341;
    --busy: #6fb3ff;
    --bad: #e06c75;
    --topbar-h: 48px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "FiraCode Nerd Font Mono", "Cascadia Code", Consolas, monospace;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  #topbar {
    height: var(--topbar-h);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    /* Menu (far left) and fit (far right) pin to the edges; space-between then
       distributes the title + connection pill evenly across the bar between
       them, rather than the title growing and shoving the pill to the edge. */
    justify-content: space-between;
    gap: 6px;
    padding: 0 8px;
    padding-top: env(safe-area-inset-top, 0);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  /* Header: "ProjectName [N]" — a colour-coded project name + a chip that mirrors
     the look (and live agent animation) of that pane's sidebar square. */
  #pane-title {
    flex: 0 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #pane-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    font-size: 13px;
  }
  .hdr-chip { flex: 0 0 auto; transform: scale(.72); cursor: default; }
  .icon-btn {
    flex: 0 0 auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    height: 34px;
    min-width: 34px;
    padding: 0 9px;
    border-radius: 7px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--border); }
  /* The fit-to-view glyph reads too small at the shared 14px; bump just its
     font so the icon fills the button without changing the 34px footprint. */
  #fit-btn { font-size: 21px; line-height: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: 0 0 auto; }
  .dot.on { background: var(--ok); }
  /* Connection state as a compact pill (dot + short label), tinted by state.
     Sits inside the fit button on the top bar. */
  #conn-pill {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
  }
  #conn-pill .dot { width: 8px; height: 8px; }
  /* Three actionable states + a transient one:
       .off       red    "Not Connected" — never established; tap to connect
       .connecting yellow "Connecting…"  — attempt in flight (not actionable)
       .reconnect yellow  "Reconnect"    — was up, dropped; pulses; tap to retry
       .on        green   "Connected"
     .off/.reconnect get a pointer cursor; the pill's click handler retries. */
  #conn-pill.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); }
  #conn-pill.on .dot { background: var(--ok); }
  #conn-pill.connecting { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
  #conn-pill.connecting .dot { background: var(--warn); }
  #conn-pill.reconnect { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); cursor: pointer; animation: conn-pulse 1.4s ease-in-out infinite; }
  #conn-pill.reconnect .dot { background: var(--warn); }
  #conn-pill.off { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); cursor: pointer; }
  #conn-pill.off .dot { background: var(--bad); }
  @keyframes conn-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  /* ── Content row (drawer + terminal) ─────────────────────────────────── */
  #content { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }

  #scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  #drawer.open ~ #scrim, #scrim.open { opacity: 1; pointer-events: auto; }

  #drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(86%, 360px);
    z-index: 50;
    background: var(--panel);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform .2s ease;
    /* Flex column so the pane tree scrolls and the profile bar pins to the bottom. */
    display: flex;
    flex-direction: column;
    padding: 8px;
    padding-top: calc(env(safe-area-inset-top, 0) + 8px);
  }
  #drawer.open { transform: translateX(0); }
  #sidebar { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  /* ── Bottom-of-sidebar: which instance to mirror (dropdown) + a gear. */
  #profile-bar {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: stretch;
    padding-top: 8px;
    margin-top: 6px;
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  #profile-select {
    flex: 1 1 0;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 8px;
    border-radius: 7px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #settings-btn { flex: 0 0 auto; height: auto; }

  /* ── Dedicated connection settings menu (centered modal over a backdrop). ── */
  #settings-panel {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    padding-top: calc(env(safe-area-inset-top, 0) + 16px);
  }
  #settings-panel[hidden] { display: none; }
  .sp-card {
    width: min(100%, 420px);
    max-height: 92%;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sp-card h2 { margin: 0; font-size: 15px; color: var(--text); }
  .sp-hint { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.45; }
  .sp-hint code { color: var(--accent); }
  #sp-list { display: flex; flex-direction: column; gap: 10px; }
  .sp-profile {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .sp-profile .row { display: flex; gap: 6px; align-items: center; }
  input.sp-label { font-weight: 600; }
  .sp-card input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    border-radius: 6px;
    font: inherit;
    width: 100%;
  }
  .sp-remove {
    flex: 0 0 auto;
    width: auto;
    background: var(--panel-2);
    border: 1px solid color-mix(in srgb, var(--bad) 50%, var(--border));
    color: var(--bad);
    padding: 8px 10px;
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .sp-add {
    background: var(--panel-2);
    border: 1px dashed var(--border);
    color: var(--dim);
    padding: 9px 12px;
    border-radius: 7px;
    font: inherit;
    cursor: pointer;
  }
  .sp-add:active { background: var(--border); }
  .sp-actions { display: flex; gap: 6px; margin-top: 2px; }
  .sp-actions button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 7px;
    font: inherit;
    cursor: pointer;
  }
  .sp-actions button:active { background: var(--border); }
  #settings-done { border-color: var(--accent); color: var(--accent); }

  .status-text { color: var(--dim); font-size: 12px; padding: 2px; }

  /* Instance-switch loading overlay — shown by connectProfile on deliberate switches
     (dropdown / settings / initial connect), hidden once the new instance's pane tree
     arrives. Background auto-reconnects call connect() directly and never show this. */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: rgba(0,0,0,.62);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #loading-overlay[hidden] { display: none; }
  .lo-card { width: min(100%, 320px); align-items: center; text-align: center; gap: 14px; }
  .lo-spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: lo-spin .8s linear infinite;
  }
  @keyframes lo-spin { to { transform: rotate(360deg); } }
  .lo-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .lo-sub { font-size: 12px; color: var(--dim); min-height: 1em; }
  .lo-actions { display: flex; gap: 8px; width: 100%; }
  .lo-actions button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 7px;
    font: inherit;
    cursor: pointer;
  }
  .lo-actions button:active { background: var(--border); }
  #lo-retry { border-color: var(--accent); color: var(--accent); }

  .window-group { margin-bottom: 14px; }
  .window-label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 4px 2px; }
  /* Each tab + its panes sit in a bordered card, like a Cortex desktop tab. The
     card whose pane you're currently mirroring takes the project color (--tab-col,
     set per-card by JS); every other card stays gray. The tab name is drawn in the
     project color. .sel-tab is toggled by renderSelection (see JS). */
  .tab-block {
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 6px 6px 4px;
    margin-bottom: 8px;
  }
  .tab-block.sel-tab { border-color: var(--tab-col, var(--accent)); }
  .tab-row { color: var(--text); padding: 4px 4px 6px; font-weight: 600; font-size: 13px; }
  /* Panes as compact numbered squares — 5 per row, wrapping at 6+. The number is
     the pane's position in the tab; the border is the project color; agent state
     rides the comet/breath; tapping a (terminal) square mirrors that pane. */
  .pane-grid {
    display: grid;
    grid-template-columns: repeat(5, 34px);
    gap: 6px;
    padding: 4px 2px 2px 2px;
  }
  /* The square itself: a numbered tile whose BORDER is the tab's project color
     (set inline; falls back to --border). Agent state is shown by reproducing the
     desktop tab-bar animations — a traveling comet for "running" and an edge
     breath for "needs attention" — both tinted by the project color. The per-square
     CSS vars (--proj-sq / --cdot / --breath / --breath-delay) are written by JS. */
  .pane-sq {
    position: relative;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    --period: 4s;
    --bperiod: 1.2s;
  }
  .pane-sq .num { position: relative; z-index: 1; }
  .pane-sq:active { background: var(--border); }
  /* Selected = filled tile + inset ring, both in the project color. */
  .pane-sq.selected {
    background: color-mix(in srgb, var(--proj-sq, var(--accent)) 24%, var(--panel-2));
    box-shadow: inset 0 0 0 2px var(--proj-sq, var(--accent));
  }
  .pane-sq.non-terminal { opacity: .45; cursor: default; }

  /* "Running" — two antipodal comet dots orbiting the square's perimeter, like the
     desktop traveling_comet (black fill, project-colored outline). Hidden unless
     .run; JS phase-anchors each dot's animation-delay so they stay locked together
     and continuous across re-renders. */
  /* `.comet` is a 0×0 point that rides the path; the visible dot is its ::before,
     centered on that point with translate(-50%,-50%). Anchoring the *point* (not a
     5px box) is what keeps the dot dead-centre on the border stroke on every edge —
     a sized box rode the path by its top-left and drifted a different way per side.
     The path traces the border CENTERLINE (inset 0.75px = half the 1.5px border;
     corner radius 6.25px = 7 − 0.75) so the dot straddles the stroke. */
  .pane-sq .comet {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    offset-anchor: center;
    offset-path: path("M 7 0.75 L 27 0.75 A 6.25 6.25 0 0 1 33.25 7 L 33.25 27 A 6.25 6.25 0 0 1 27 33.25 L 7 33.25 A 6.25 6.25 0 0 1 0.75 27 L 0.75 7 A 6.25 6.25 0 0 1 7 0.75 Z");
    offset-distance: 0%;
    offset-rotate: 0deg;
    display: none;
    pointer-events: none;
    z-index: 2;
  }
  .pane-sq .comet::before {
    content: "";
    position: absolute;
    left: 0; top: 0;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #000;
    border: 1.25px solid var(--cdot, #707070);
    transform: translate(-50%, -50%);
  }
  .pane-sq.run .comet { display: block; animation: comet-orbit var(--period, 4s) linear infinite; }
  @keyframes comet-orbit { to { offset-distance: 100%; } }

  /* "Needs attention" (blocked) — a 2px project-colored frame breathing 10%↔70%,
     like the desktop row_glow_breath. The custom props inherit to ::after. */
  .pane-sq::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 6px;
    border: 2px solid var(--breath, #9aa0aa);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  .pane-sq.attn::after { animation: sq-breath var(--bperiod, 1.2s) var(--breath-delay, 0s) ease-in-out infinite; }
  @keyframes sq-breath { 0%, 100% { opacity: .10; } 50% { opacity: .70; } }

  /* "Done" (success) — a small static green pip in the corner. */
  .pane-sq .donepip {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ok);
    display: none;
    z-index: 2;
  }
  .pane-sq.done .donepip { display: block; }

  /* ── Terminal ────────────────────────────────────────────────────────── */
  #main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #term-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    background: #000;
    padding: 4px;
    /* Allow one-finger pan/scroll but suppress the browser's page pinch-zoom —
       pinching here scales only the terminal font (handled in JS), not the UI. */
    touch-action: pan-x pan-y;
  }
  #terminal { width: max-content; }
  #empty-hint { margin: auto; color: var(--dim); text-align: center; padding: 24px; }

  /* ── Soft-key bar ────────────────────────────────────────────────────── */
  #softkeys {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;          /* wrap to a 2nd row so every key stays reachable */
    gap: 6px;
    padding: 7px 8px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0) + 7px);
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #softkeys button {
    flex: 0 0 auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    height: 36px;
    min-width: 34px;
    padding: 0 8px;
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #softkeys button:active:not(:disabled) { background: var(--border); }
  #softkeys button:disabled { opacity: .35; }
  /* Command keys (^C / ⏎ / clear / exit / /compact) tint to the current project. */
  #softkeys .cmd { color: var(--proj); border-color: var(--proj); }
  /* Keys live in groups that wrap as ATOMIC units — a cluster never splits across
     rows, so the arrows can't get orphaned onto a second line one at a time. */
  .key-group { display: flex; flex-wrap: nowrap; gap: 6px; }

  /* ── Compose bar ("holding pane") ─────────────────────────────────────── */
  #compose {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: flex-end;
    padding: 7px 8px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #compose textarea {
    flex: 1 1 auto;
    min-width: 0;
    height: 40px;            /* one row; JS auto-grows up to max-height */
    max-height: 7.4em;       /* ~5 rows, then scroll */
    resize: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font: inherit;
    font-size: 15px;
    line-height: 1.35;
    overflow-y: auto;
  }
  #compose textarea:disabled { opacity: .4; }
  #send-btn {
    flex: 0 0 auto;
    align-self: stretch;
    min-width: 64px;
    padding: 0 14px;
    background: var(--panel-2);
    border: 1px solid var(--proj);
    color: var(--proj);
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #send-btn:active:not(:disabled) { background: var(--border); }
  #send-btn:disabled { opacity: .4; }

  /* ── Selection handles + copy toast ───────────────────────────────────── */
  .sel-handle {
    position: fixed;
    z-index: 60;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    box-shadow: 0 1px 5px rgba(0, 0, 0, .6);
    transform: translate(-50%, -50%);
    display: none;
    touch-action: none;       /* we drive the drag ourselves */
  }
  .sel-handle::after { content: ""; position: absolute; inset: -18px; } /* fat touch target */
  .sel-handle.show { display: block; }
  /* Explicit Copy button — appears once a selection exists; sits at the top,
     clear of the fingers and the keyboard, so it's a reliable target after the
     (fiddly) handle drag rather than auto-firing on release. */
  #copy-btn {
    position: fixed;
    left: 50%;
    top: calc(var(--topbar-h) + env(safe-area-inset-top, 0) + 10px);
    transform: translateX(-50%);
    z-index: 65;
    display: none;
    background: var(--accent);
    color: #04121f;
    border: none;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 24px;
    border-radius: 999px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .55);
    cursor: pointer;
  }
  #copy-btn.show { display: block; }
  #copy-btn:active { filter: brightness(.88); }
  #copy-toast {
    position: fixed;
    left: 50%;
    bottom: 110px;
    transform: translateX(-50%);
    z-index: 70;
    background: var(--panel-2);
    border: 1px solid var(--ok);
    color: var(--ok);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease;
  }
  #copy-toast.show { opacity: 1; }

  /* ── Wide screens: drawer becomes a static sidebar ───────────────────── */
  @media (min-width: 820px) {
    #menu-btn { display: none; }
    #scrim { display: none; }
    #drawer {
      position: static;
      transform: none;
      width: 320px;
      z-index: auto;
      transition: none;
    }
  }
</style>
</head>
<body>
  <header id="topbar">
    <button id="menu-btn" class="icon-btn" title="Panes">☰</button>
    <div id="pane-title"><span id="pane-name">No pane</span></div>
    <span id="conn-pill" role="button" tabindex="0" title="Connection status — tap to (re)connect"><span class="dot" id="conn-dot"></span><span id="conn-pill-text">Not Connected</span></span>
    <button id="fit-btn" class="icon-btn" title="Fit width (pinch to zoom)">⤢</button>
  </header>

  <div id="content">
    <aside id="drawer" class="open">
      <!-- Hidden active-connection buffer: connect() reads these three. The
           localStorage profiles are the source of truth; switching a profile (or
           editing it in the settings menu) copies its values here. -->
      <div id="conn-buffer" hidden>
        <input id="host" value="127.0.0.1" />
        <input id="port" value="9278" />
        <input id="token" type="password" />
      </div>
      <div id="sidebar"><div id="empty-hint">Connecting…</div></div>
      <!-- Bottom of the sidebar: pick which instance to mirror (dropdown scales to
           many machines × prod/dev); gear opens the connection settings menu. -->
      <div id="profile-bar">
        <select id="profile-select" title="Which instance to mirror"></select>
        <button id="settings-btn" class="icon-btn" title="Manage connections">⚙</button>
      </div>
    </aside>

    <main id="main">
      <div id="term-wrap"><div id="terminal"></div></div>
    </main>

    <div id="scrim"></div>

    <!-- Dedicated connection settings menu: host/port/token per desktop. Opened
         by the gear in the profile bar; backdrop-tap closes without saving. -->
    <div id="settings-panel" hidden>
      <div class="sp-card">
        <h2>Connections</h2>
        <p class="sp-hint">One entry per instance — e.g. each machine's Prod and Dev. Host: use the Tailscale <b>MagicDNS</b> name (e.g. <code>desktop.tailnet.ts.net</code>) so it keeps working when the IP changes. Prod/Dev on one machine share a host and differ by port.</p>
        <div id="sp-list"><!-- one .sp-profile block per connection, built by JS --></div>
        <button id="sp-add" class="sp-add">+ Add connection</button>
        <span class="status-text" id="conn-status"></span>
        <div class="sp-actions">
          <button id="settings-disconnect">Disconnect</button>
          <button id="settings-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Instance-switch loading overlay: covers the screen while a deliberate
       connect/switch establishes and the new instance's pane tree loads. -->
  <div id="loading-overlay" hidden>
    <div class="sp-card lo-card">
      <div class="lo-spinner"></div>
      <div class="lo-title" id="lo-title">Connecting…</div>
      <div class="lo-sub" id="lo-sub"></div>
      <div class="lo-actions" id="lo-actions" hidden>
        <button id="lo-retry">Retry</button>
        <button id="lo-cancel">Close</button>
      </div>
    </div>
  </div>

  <div id="compose">
    <textarea id="compose-input" rows="1" placeholder="Send text…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button id="send-btn" class="cmd" title="Enter — paste the composed text and submit, or press Enter alone when empty">⏎</button>
  </div>

  <div id="softkeys">
    <div class="key-group">
      <button data-keys="1b" title="Escape">Esc</button>
      <button data-keys="09" title="Tab">Tab</button>
      <button data-keys="2f" title="Type a slash">/</button>
    </div>
    <div class="key-group">
      <button data-keys="1b5b41" title="Up">↑</button>
      <button data-keys="1b5b42" title="Down">↓</button>
      <button data-keys="1b5b44" title="Left">←</button>
      <button data-keys="1b5b43" title="Right">→</button>
      <button data-keys="7f" title="Backspace (delete a character)">⌫</button>
    </div>
    <div class="key-group">
      <button data-keys="1b5b5a" title="Shift+Tab — cycle a running model's mode">⇧Tab</button>
      <button data-keys="03" class="cmd" title="Ctrl-C (interrupt)">^C</button>
      <button id="cmd-clear" class="cmd" title="Clear — /clear when a CLI agent is running, else clear">clear</button>
      <button id="cmd-exit" class="cmd" title="Exit — /exit when a CLI agent is running, else exit">exit</button>
      <button id="cmd-compact" class="cmd" title="Send the /compact CLI command (Claude Code)">compact</button>
    </div>
  </div>

  <!-- Touch text-selection handles + Copy button + copy toast (overlay, fixed). -->
  <div id="sel-a" class="sel-handle"></div>
  <div id="sel-b" class="sel-handle"></div>
  <button id="copy-btn" title="Copy the highlighted text">Copy</button>
  <div id="copy-toast"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const decode = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const b64encode = (bytes) => {
    let s = "";
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s);
  };
  const utf8 = (str) => new TextEncoder().encode(str);
  const hexBytes = (hex) => {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  };
  const sameId = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const isTouch = window.matchMedia("(pointer: coarse)").matches;
  // Only accept a strict #rrggbb from the server before inlining it as a style.
  const safeColor = (c) => (typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c)) ? c : null;

  // ── xterm.js setup ─────────────────────────────────────────────────────
  // No fit addon: we size the grid to the desktop pane's cols/rows (from the
  // Snapshot frame) and let the user zoom/pan, so the mirror stays faithful.
  let fontSize = 13;
  const term = new Terminal({
    cols: 80,
    rows: 24,
    fontFamily: '"FiraCode Nerd Font Mono", "Cascadia Code", Consolas, monospace',
    fontSize: fontSize,
    cursorBlink: true,
    scrollback: 8000,
    theme: { background: "#000000" },
  });
  term.open($("terminal"));
  let dims = { cols: 80, rows: 24 };

  function applyFont() {
    fontSize = Math.max(5, Math.min(28, fontSize));
    term.options.fontSize = fontSize;
    if (typeof sel !== "undefined" && sel) placeHandles();
  }
  function fitWidth() {
    // Pick the largest font whose grid width still fits the viewport, so the
    // whole desktop width is visible; the user can A+ past this and pan.
    const avail = $("term-wrap").clientWidth - 10;
    if (avail > 0 && dims.cols > 0) {
      fontSize = Math.floor(avail / (dims.cols * 0.6));
      applyFont();
    }
  }

  // ── Connection state ───────────────────────────────────────────────────
  let ws = null;
  let currentPaneId = null;
  let refreshTimer = null;
  let lastWindows = [];      // latest pane tree (for agent-awareness + numbering)
  // Auto-size (fit-to-width +3) should run only on the FIRST snapshot of a new
  // subscription — not on re-subscribes to the same pane (e.g. the clear re-sync
  // below), which would otherwise snap the user's pinch-zoom back to the default.
  let autoSizeNextSnapshot = false;

  // 3-state connection model. `connState` ∈ off | connecting | connected |
  // reconnect. `everConnected` distinguishes "never up" (red, Not Connected)
  // from "was up, dropped" (yellow, Reconnect). Auto-reconnect uses a bounded
  // backoff so a dead bridge isn't hammered; the pill is always a manual retry.
  let connState = "off";
  let everConnected = false;
  let retryTimer = null;
  let retryCount = 0;
  const MAX_AUTO_RETRIES = 5;

  // ── Connection profiles (which instance to mirror) ──────────────────────────
  // An arbitrary list of instances (each machine × prod/dev). Source of truth is
  // localStorage; #host/#port/#token are just the buffer connect() reads. Two
  // built-ins seed first run; the user adds/edits/removes the rest in settings.
  const PROFILE_KEY = "cortex.mobile.profiles";
  function defaultProfiles() {
    return {
      active: "dev",
      list: [
        { id: "prod", label: "Desktop (Prod)", host: "", port: "9278", token: "" },
        { id: "dev",  label: "Desktop (Dev)",  host: "", port: "9280", token: "" },
      ],
    };
  }
  let firstRun = false;
  let profileStore = loadProfiles();

  function genId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function getProfile(id) { return (profileStore.list || []).find((p) => p.id === id) || null; }

  function loadProfiles() {
    let raw = null;
    try { raw = localStorage.getItem(PROFILE_KEY); } catch (_) {}
    firstRun = !raw;
    let store = null;
    try { store = raw ? JSON.parse(raw) : null; } catch (_) {}
    // Migrate the older {profiles:{prod,dev}} map shape into the list shape.
    if (store && !Array.isArray(store.list) && store.profiles) {
      store = {
        active: store.active,
        list: Object.keys(store.profiles).map((id) => Object.assign({ id }, store.profiles[id])),
      };
    }
    if (!store || !Array.isArray(store.list) || !store.list.length) store = defaultProfiles();
    for (const p of store.list) {            // backfill any missing fields
      p.id = p.id || ("p" + store.list.indexOf(p));
      p.label = p.label || p.id;
      p.host = p.host || "";
      p.port = String(p.port || "");
      p.token = p.token || "";
    }
    if (!store.list.find((p) => p.id === store.active)) store.active = store.list[0].id;
    return store;
  }
  function saveProfiles() {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profileStore)); } catch (_) {}
  }
  function activeProfile() { return getProfile(profileStore.active); }

  function loadActiveIntoBuffer() {
    const p = activeProfile();
    if (!p) return;
    $("host").value = p.host || window.location.hostname || "127.0.0.1";
    $("port").value = p.port || "9278";
    $("token").value = p.token || "";
  }
  // Populate the bottom-of-sidebar dropdown from the profile list.
  function renderProfileBar() {
    const sel = $("profile-select");
    if (!sel) return;
    sel.innerHTML = "";
    for (const p of profileStore.list) {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.label || p.id;
      sel.appendChild(opt);
    }
    sel.value = profileStore.active;
  }
  // Switch the mirrored instance: load its creds into the buffer and connect.
  // `reveal` (deliberate Prod↔Dev switches) opens the drawer once the new instance's
  // pane tree loads, so its panes are immediately pickable.
  function connectProfile(id, reveal) {
    const p = getProfile(id);
    if (!p) return;
    profileStore.active = id;
    saveProfiles();
    loadActiveIntoBuffer();
    everConnected = false;     // fresh target — a failure here is "Not Connected", not "Reconnect"
    retryCount = 0;
    clearRetry();
    renderProfileBar();
    // Reset the mirrored view so the previous instance's tree/pane never lingers
    // through the switch; the new instance repopulates it once its pane list lands.
    currentPaneId = null;
    lastWindows = [];
    lastTreeSig = null;
    term.reset();
    clearSelectionUI();
    setInputEnabled(false);
    $("sidebar").innerHTML = '<div id="empty-hint">Connecting…</div>';
    renderSelection();         // header → "No pane"
    showLoading(p.label || id, reveal);
    connect();
  }

  function setConnState(state, detail) {
    connState = state;
    const pill = $("conn-pill");
    pill.classList.toggle("on", state === "connected");
    pill.classList.toggle("connecting", state === "connecting");
    pill.classList.toggle("reconnect", state === "reconnect");
    pill.classList.toggle("off", state === "off");
    const label = state === "connected" ? "Connected"
      : state === "connecting" ? "Connecting…"
      : state === "reconnect" ? "Reconnect"
      : "Not Connected";
    $("conn-pill-text").textContent = label;
    const cs = $("conn-status"); if (cs) cs.textContent = detail || label;
  }

  // ── Instance-switch loading overlay ──────────────────────────────────────────
  // Shown only on deliberate (re)connects via connectProfile — a Prod/Dev switch, a
  // settings save, or the initial auto-connect — so the user sees the switch take and
  // the interface reload. Background reconnects go through connect() and stay quiet.
  // `loadingActive` gates the success/error transitions; `loadingReveal` opens the
  // drawer on success (deliberate switches) so the new instance's panes are pickable.
  let loadingActive = false, loadingReveal = false, loadingTimer = null;
  function showLoading(label, reveal) {
    loadingActive = true;
    loadingReveal = !!reveal;
    $("lo-title").textContent = label ? `Connecting to ${label}…` : "Connecting…";
    $("lo-sub").textContent = "";
    $("lo-actions").hidden = true;
    $("loading-overlay").hidden = false;
    if (loadingTimer) clearTimeout(loadingTimer);
    loadingTimer = setTimeout(() => loadingError("Timed out reaching the desktop."), 12000);
  }
  function hideLoading() {
    loadingActive = false;
    if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
    $("loading-overlay").hidden = true;
  }
  function loadingError(msg) {
    if (!loadingActive) return;          // only while a deliberate connect is pending
    if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
    $("lo-title").textContent = "Couldn't connect";
    $("lo-sub").textContent = msg || "";
    $("lo-actions").hidden = false;      // reveal Retry / Close
  }

  function connect() {
    disconnect();
    clearRetry();
    const host = $("host").value.trim();
    const port = $("port").value.trim();
    const token = $("token").value.trim();
    const scheme = (window.location.protocol === "https:") ? "wss" : "ws";
    let url = `${scheme}://${host}:${port}/ws`;
    if (token) url += `?token=${encodeURIComponent(token)}`;
    setConnState("connecting", `connecting to ${scheme}://${host}:${port}/ws …`);
    try { ws = new WebSocket(url); }
    catch (e) { console.warn("ws ctor failed", e); if (loadingActive) loadingError("Bad connection URL."); onDropped("bad url"); return; }

    ws.onopen = () => {
      everConnected = true;
      retryCount = 0;
      setConnState("connected", "connected");
      if (loadingActive) $("lo-sub").textContent = "Loading workspace…"; // socket up; await tree
      listPanes();
      refreshTimer = setInterval(listPanes, 3000); // server push lands in M4b
    };
    ws.onclose = () => { stopPolling(); setInputEnabled(false); onDropped("closed"); };
    ws.onerror = () => { /* onclose follows; state is set there */ };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { console.warn("bad frame", ev.data); return; }
      handle(msg);
    };
  }

  // A socket closed/failed. If we'd ever connected, offer Reconnect (yellow) and
  // schedule a bounded auto-retry; otherwise it's Not Connected (red).
  function onDropped(detail) {
    // A deliberate connect that dropped before its pane tree loaded → surface it in
    // the loading overlay rather than silently leaving the spinner up.
    if (loadingActive) loadingError(`Connection ${detail ? `failed (${detail})` : "failed"}.`);
    if (everConnected) {
      setConnState("reconnect", detail ? `disconnected (${detail}) — tap to reconnect` : "disconnected — tap to reconnect");
      scheduleRetry();
    } else {
      setConnState("off", "not connected");
    }
  }
  function scheduleRetry() {
    clearRetry();
    if (retryCount >= MAX_AUTO_RETRIES) return;          // give up auto; pill stays tap-to-retry
    const delay = Math.min(2000 * Math.pow(2, retryCount), 30000); // 2,4,8,16,30s
    retryCount++;
    retryTimer = setTimeout(() => {
      if (connState === "reconnect" && (!ws || ws.readyState !== WebSocket.OPEN)) connect();
    }, delay);
  }
  function clearRetry() { if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; } }

  // User-initiated retry (pill tap): reset backoff, then connect.
  function userReconnect() { retryCount = 0; clearRetry(); connect(); }
  // Auto-reconnect when the app regains focus / network returns — the usual cause
  // of a silent drop is the phone suspending a backgrounded tab.
  function maybeReconnect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (connState === "connecting") return;
    if (connState === "reconnect" || (connState === "off" && everConnected)) {
      retryCount = 0; clearRetry(); connect();
    }
  }
  function manualDisconnect() {
    clearRetry();
    retryCount = 0;
    everConnected = false;
    disconnect();
    setConnState("off", "disconnected");
  }

  function disconnect() {
    stopPolling();
    setInputEnabled(false);
    if (ws) {
      // Detach handlers so this programmatic close doesn't bounce through
      // onDropped and clobber the state we're about to set.
      ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
      try { ws.close(); } catch (_) {}
      ws = null;
    }
  }
  function stopPolling() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }
  function listPanes() { send({ type: "list_panes" }); }

  function subscribe(paneId) {
    // A genuinely new pane gets the one-time auto-size; a same-pane re-subscribe
    // (the clear re-sync) keeps whatever zoom the user has pinched to.
    const isNewPane = !currentPaneId || !sameId(currentPaneId, paneId);
    if (currentPaneId && !sameId(currentPaneId, paneId)) {
      send({ type: "unsubscribe", pane_id: currentPaneId });
    }
    currentPaneId = paneId;
    autoSizeNextSnapshot = isNewPane;
    term.reset();
    clearSelectionUI();
    send({ type: "subscribe", pane_id: paneId });
    setInputEnabled(true);
    closeDrawer();             // mobile: reveal the terminal
    renderSelection();
  }

  // ── Input ────────────────────────────────────────────────────────────────
  function sendInput(bytes) {
    if (!currentPaneId || !bytes || !bytes.length) return;
    send({ type: "input", pane_id: currentPaneId, bytes_b64: b64encode(bytes) });
  }
  function submitCommand(cmd) {
    sendInput(utf8(cmd));
    setTimeout(() => sendInput(utf8("\r")), 60); // DelayedEnter, like desktop smart-clear
  }
  function setInputEnabled(on) {
    document.querySelectorAll("#softkeys button").forEach((b) => { b.disabled = !on; });
    $("compose-input").disabled = !on;
    $("send-btn").disabled = !on;
  }

  // ── Incoming frames ──────────────────────────────────────────────────────
  function handle(msg) {
    switch (msg.type) {
      case "pane_list":
        lastWindows = msg.windows || [];
        renderTree(lastWindows);
        syncActiveDims();
        // The tree arrived → the deliberate switch succeeded and the interface
        // reloaded. Dismiss the loading overlay (and reveal the fresh pane tree).
        if (loadingActive) { const reveal = loadingReveal; hideLoading(); if (reveal) openDrawer(); }
        break;
      case "snapshot":
        if (sameId(msg.pane_id, currentPaneId)) {
          if (msg.cols && msg.rows) {
            dims = { cols: msg.cols, rows: msg.rows };
            term.resize(msg.cols, msg.rows);
            // Start at fit-to-width then 3 sizes larger (what 3 taps of the old
            // A+ gave) so the mirror opens comfortably readable; pinch from there.
            // Only on a fresh subscription — a re-subscribe (clear re-sync) keeps zoom.
            if (isTouch && autoSizeNextSnapshot) { fitWidth(); fontSize += 3; applyFont(); }
          }
          autoSizeNextSnapshot = false;
          term.reset();
          term.write(decode(msg.ansi_b64));
        }
        break;
      case "output":
        if (sameId(msg.pane_id, currentPaneId)) term.write(decode(msg.bytes_b64));
        break;
      case "error":
        console.warn("bridge error:", msg.message);
        // A protocol-level error frame: stay connected if the socket is still
        // open (it's a per-request gripe, not a disconnect); otherwise reflect drop.
        if (ws && ws.readyState === WebSocket.OPEN) setConnState("connected", "⚠ " + msg.message);
        else onDropped("error");
        break;
      default:
        console.warn("unknown frame type:", msg.type, msg);
    }
  }

  // ── Sidebar rendering ──────────────────────────────────────────────────
  // The pane tree changes shape only occasionally, but we poll every 3s. Rebuilding
  // the DOM each poll would restart the squares' CSS animations (comet/breath), so
  // rebuild only when a cheap signature of the tree actually changes; otherwise just
  // refresh selection + header (cheap, and must run every poll to stay current).
  let lastTreeSig = null;
  function treeSig(windows) {
    const parts = [];
    for (const w of windows) for (const t of (w.tabs || [])) {
      parts.push(t.tab_id, t.title, t.color || "", t.project_name || "",
        (t.panes || []).map((p) =>
          `${JSON.stringify(p.pane_id)}~${p.kind}~${p.agent || ""}~${p.status || ""}`).join(","));
    }
    return parts.join("|");
  }
  function renderTree(windows) {
    const sig = treeSig(windows);
    if (sig !== lastTreeSig) { lastTreeSig = sig; buildTree(windows); }
    renderSelection();
  }
  function buildTree(windows) {
    const sidebar = $("sidebar");
    sidebar.innerHTML = "";
    if (!windows.length) {
      sidebar.innerHTML = '<div id="empty-hint">No windows reported.</div>';
      return;
    }
    windows.forEach((win, wi) => {
      const group = document.createElement("div");
      group.className = "window-group";
      const label = document.createElement("div");
      label.className = "window-label";
      label.textContent = `Window ${wi + 1}`;
      group.appendChild(label);

      (win.tabs || []).forEach((tab) => {
        const block = document.createElement("div");
        block.className = "tab-block";
        const col = safeColor(tab.color); // tab's saved Cortex project color, if any
        block.dataset.tabId = tab.tab_id;
        // --tab-col is the border color when this card is the mirrored one; fall back
        // to the accent so a project-less tab still reads as "selected" when chosen.
        block.style.setProperty("--tab-col", col || "var(--accent)");

        const tabRow = document.createElement("div");
        tabRow.className = "tab-row";
        tabRow.textContent = tab.title || "(untitled)";
        tabRow.style.color = col || "";   // name in the project color (else default text)
        block.appendChild(tabRow);
        const grid = document.createElement("div");
        grid.className = "pane-grid";
        (tab.panes || []).forEach((pane, pi) => grid.appendChild(renderPaneSquare(pane, pi + 1, col)));
        block.appendChild(grid);
        group.appendChild(block);
      });
      sidebar.appendChild(group);
    });
  }

  // The bare square DOM: a centered number plus the (CSS-driven) comet dots and
  // done-pip overlays. Shared by the sidebar tiles and the header chip.
  function makeSquareEl(num) {
    const sq = document.createElement("div");
    sq.className = "pane-sq";
    const numEl = document.createElement("span");
    numEl.className = "num";
    numEl.textContent = num;
    const c1 = document.createElement("i"); c1.className = "comet"; c1.dataset.anim = "cometA";
    const c2 = document.createElement("i"); c2.className = "comet"; c2.dataset.anim = "cometB";
    const pip = document.createElement("i"); pip.className = "donepip";
    sq.append(numEl, c1, c2, pip);
    return sq;
  }
  // A pane as a compact numbered square. The number is the pane's position in the
  // tab; the project color is its border; agent state (running / needs-attention /
  // done) shows via the comet / breath / pip, painted by decorateSquare. The full
  // kind/agent/status rides in the tooltip. Only terminal panes are clickable.
  function renderPaneSquare(pane, num, projColor) {
    const sq = makeSquareEl(num);
    const isTerminal = pane.kind === "Terminal";
    if (!isTerminal) sq.classList.add("non-terminal");
    sq.dataset.paneId = JSON.stringify(pane.pane_id);
    decorateSquare(sq, pane, projColor);

    const bits = [pane.kind];
    if (pane.agent) bits.push(pane.agent);
    if (pane.status) bits.push(pane.status.replace("_", " "));
    if (!isTerminal) bits.push("(not mirrorable)");
    sq.title = bits.join(" · ");

    if (isTerminal) sq.addEventListener("click", () => subscribe(pane.pane_id));
    return sq;
  }
  // The header "[N]" chip: the same square, scaled down, non-interactive, mirroring
  // the subscribed pane's live state.
  function buildHeaderChip(pane, projColor, num) {
    const chip = makeSquareEl(num);
    chip.classList.add("hdr-chip");
    decorateSquare(chip, pane, projColor);
    return chip;
  }

  function renderSelection() {
    document.querySelectorAll("#sidebar .pane-sq").forEach((sq) => {
      let id;
      try { id = JSON.parse(sq.dataset.paneId); } catch { return; }
      sq.classList.toggle("selected", currentPaneId && sameId(id, currentPaneId));
    });
    // Tab card: the project-color border marks the tab whose pane we're mirroring;
    // every other card stays gray. (Runs here, not in buildTree, because the mirrored
    // pane can change without the tree — and thus the sidebar DOM — changing.)
    const loc = currentPaneId ? findPaneLocation(currentPaneId) : null;
    const selTabId = loc ? loc.tab.tab_id : null;
    document.querySelectorAll("#sidebar .tab-block").forEach((b) =>
      b.classList.toggle("sel-tab", selTabId !== null && b.dataset.tabId === selTabId));
    // Header: "ProjectName [N]" — the name in the project color, [N] a chip that
    // mirrors the subscribed pane's sidebar square (incl. its live agent animation).
    // Falls back to the tab title (neutral) when the tab maps to no project, and to
    // "No pane" when nothing is subscribed.
    const nameEl = $("pane-name");
    const oldChip = $("pane-title").querySelector(".hdr-chip");
    if (oldChip) oldChip.remove();
    let proj = null;
    if (currentPaneId) {
      if (loc) {
        proj = safeColor(loc.tab.color);
        nameEl.textContent = loc.tab.project_name || loc.tab.title || "Terminal";
        nameEl.style.color = proj || "";
        $("pane-title").appendChild(buildHeaderChip(loc.pane, proj, loc.index));
      } else {
        nameEl.textContent = "Terminal pane";
        nameEl.style.color = "";
      }
    } else {
      nameEl.textContent = "No pane";
      nameEl.style.color = "";
    }

    document.documentElement.style.setProperty("--proj", proj || "#6fb3ff");

  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ── Agent-aware infra ──────────────────────────────────────────────────────
  // The polled pane tree carries each pane's `agent` (e.g. "Claude Code") and
  // `status`. We keep the latest tree (`lastWindows`) and expose lookups so
  // features can adapt to the *subscribed* pane — starting with the command
  // soft-keys (slash form for an agent, bare command for a plain shell), and
  // reused by anything that needs "is this pane an agent / what number is it."
  const COMET_P = 4000, BREATH_P = 1200;  // ms — match the desktop comet/breath periods
  function paneAgentState(pane) {
    const status = (pane && pane.status) || null;
    return {
      agent: (pane && pane.agent) || null,
      status,
      running: status === "in_progress",   // → comet
      attention: status === "blocked",     // → breath (canonical "waiting on you")
      done: status === "success",          // → static green pip
    };
  }
  // Paint a square (sidebar tile or header chip) for a pane: project-color border +
  // the running/attention/done treatment. The animations are phase-anchored to a
  // shared wall clock (performance.now) so every square stays locked together and
  // continuous across re-renders — the client-side analog of the desktop's global
  // AnimationClock. This is the reusable agent-state surface other features build on.
  function decorateSquare(el, pane, projColor) {
    const st = paneAgentState(pane);
    el.classList.toggle("run", st.running);
    el.classList.toggle("attn", st.attention);
    el.classList.toggle("done", st.done);
    el.style.borderColor = projColor || "";                          // else CSS --border
    el.style.setProperty("--proj-sq", projColor || "#6fb3ff");       // selection tint source
    el.style.setProperty("--cdot", projColor || "#707070");          // comet outline
    el.style.setProperty("--breath", projColor ? `color-mix(in srgb, ${projColor} 80%, #fff)` : "#9aa0aa");
    const t = performance.now();
    if (st.running) {
      const a = el.querySelector('[data-anim="cometA"]');
      const b = el.querySelector('[data-anim="cometB"]');   // antipodal: half a lap ahead
      if (a) a.style.animationDelay = `-${(t % COMET_P) / 1000}s`;
      if (b) b.style.animationDelay = `-${((t % COMET_P) + COMET_P / 2) / 1000}s`;
    }

  }
  function findPaneLocation(paneId) {
    if (!paneId) return null;
    for (const win of lastWindows) {
      for (const tab of (win.tabs || [])) {
        const idx = (tab.panes || []).findIndex((p) => sameId(p.pane_id, paneId));
        if (idx >= 0) return { tab, pane: tab.panes[idx], index: idx + 1 };
      }
    }
    return null;
  }
  function currentPaneAgent() {
    const loc = findPaneLocation(currentPaneId);
    return loc && loc.pane && loc.pane.agent ? loc.pane.agent : null;
  }
  // Keep the phone's grid sized to the desktop pane it's mirroring. Each poll the
  // desktop reports the live pane's current cols/rows; if they drift from our grid
  // we re-resize so a TUI's wrap/cursor math (Claude/Ink computes its redraw moves
  // from the column count) stays aligned and the mirror stops ghosting. Resizing
  // reflows xterm; the app's next frame repaints clean at the corrected width. We
  // touch only the grid, not the font, so the user's pinch-zoom is preserved.
  function syncActiveDims() {
    if (!currentPaneId) return;
    const loc = findPaneLocation(currentPaneId);
    const p = loc && loc.pane;
    if (!p || !p.cols || !p.rows) return;
    if (p.cols === term.cols && p.rows === term.rows) return;
    dims = { cols: p.cols, rows: p.rows };
    term.resize(p.cols, p.rows);
    if (typeof sel !== "undefined" && sel) placeHandles();
  }

  // ── Drawer ───────────────────────────────────────────────────────────────
  function openDrawer() { $("drawer").classList.add("open"); $("scrim").classList.add("open"); }

  // ── Wire up controls ─────────────────────────────────────────────────────
  // Seed profiles from how the page was served: any profile lacking a host gets
  // this origin's host (so navigating once via a MagicDNS name fills them); the
  // profile whose port matches the served port adopts the ?token= and, on first
  // run only, becomes active. User edits (non-empty fields, chosen active) win.
  (function migrateFromLocation() {
    try {
      const loc = window.location;
      if (loc.protocol !== "http:" && loc.protocol !== "https:") return;
      const host = loc.hostname || "";
      const port = loc.port || (loc.protocol === "https:" ? "443" : "80");
      const tok = new URLSearchParams(loc.search).get("token") || "";
      for (const p of profileStore.list) {
        if (!p.host && host) p.host = host;
        if (p.port === port) {
          if (tok && !p.token) p.token = tok;

    } catch (_) {}

  $("menu-btn").addEventListener("click", toggleDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  $("fit-btn").addEventListener("click", fitWidth);   // pinch handles zoom; this re-fits

  // Top-bar connection pill: tap to (re)connect when off or dropped.
  function pillRetry() { if (connState === "off" || connState === "reconnect") userReconnect(); }
  $("conn-pill").addEventListener("click", pillRetry);
  $("conn-pill").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pillRetry(); } });

  // Bottom-of-sidebar instance dropdown + the gear that opens the settings menu.
  $("profile-select").addEventListener("change", (e) => connectProfile(e.target.value, true));
  $("settings-btn").addEventListener("click", openSettings);

  // ── Connection settings menu (dynamic add/edit/remove list) ─────────────────
  function buildProfileBlock(p) {
    const root = document.createElement("div");
    root.className = "sp-profile";
    root.dataset.id = p.id;

    const nameRow = document.createElement("div");
    nameRow.className = "row";
    const label = document.createElement("input");
    label.className = "sp-label"; label.placeholder = "name (e.g. Desktop (Dev))"; label.value = p.label || "";
    const rm = document.createElement("button");
    rm.className = "sp-remove"; rm.type = "button"; rm.textContent = "Remove";
    rm.addEventListener("click", () => root.remove());
    nameRow.appendChild(label); nameRow.appendChild(rm);

    const hpRow = document.createElement("div");
    hpRow.className = "row";
    const host = document.createElement("input");
    host.className = "sp-host"; host.placeholder = "host (MagicDNS name)"; host.style.flex = "2"; host.value = p.host || "";
    const port = document.createElement("input");
    port.className = "sp-port"; port.placeholder = "port"; port.setAttribute("inputmode", "numeric"); port.style.flex = "1"; port.value = p.port || "";
    hpRow.appendChild(host); hpRow.appendChild(port);

    const token = document.createElement("input");
    token.className = "sp-token"; token.type = "password"; token.placeholder = "token"; token.value = p.token || "";

    root.appendChild(nameRow); root.appendChild(hpRow); root.appendChild(token);

  }
  function openSettings() {
    const list = $("sp-list");
    list.innerHTML = "";
    for (const p of profileStore.list) list.appendChild(buildProfileBlock(p));
    $("settings-panel").hidden = false;
  }
  function closeSettings(save) {
    if (save) {
      const prevActive = profileStore.active;
      const before = activeProfile();
      const beforeSig = before ? `${before.host}|${before.port}|${before.token}` : null;
      const blocks = [...$("sp-list").querySelectorAll(".sp-profile")];
      const newList = blocks.map((root) => ({
        id: root.dataset.id || genId(),
        label: root.querySelector(".sp-label").value.trim() || (root.dataset.id || "instance"),
        host: root.querySelector(".sp-host").value.trim(),
        port: root.querySelector(".sp-port").value.trim() || "9278",
        token: root.querySelector(".sp-token").value,
      }));
      if (newList.length) {                      // ignore a fully-emptied list
        profileStore.list = newList;
        if (!getProfile(profileStore.active)) profileStore.active = newList[0].id;
      }
      saveProfiles();
      renderProfileBar();
      // Reconnect if the active instance changed or its connection details did.
      const after = activeProfile();
      const afterSig = after ? `${after.host}|${after.port}|${after.token}` : null;
      if (profileStore.active !== prevActive || afterSig !== beforeSig) connectProfile(profileStore.active, true);
      else loadActiveIntoBuffer();
    }

  }
  $("sp-add").addEventListener("click", () =>
    $("sp-list").appendChild(buildProfileBlock({ id: genId(), label: "", host: "", port: "", token: "" })));
  $("settings-done").addEventListener("click", () => closeSettings(true));
  $("settings-disconnect").addEventListener("click", manualDisconnect);
  $("settings-panel").addEventListener("click", (e) => { if (e.target === $("settings-panel")) closeSettings(false); });

  // Loading-overlay actions (only visible after a deliberate connect failed).
  $("lo-retry").addEventListener("click", () => connectProfile(profileStore.active, loadingReveal));
  $("lo-cancel").addEventListener("click", hideLoading);

  // Auto-reconnect when the app comes back to the foreground / network returns.
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") maybeReconnect(); });
  window.addEventListener("focus", maybeReconnect);
  window.addEventListener("online", maybeReconnect);

  // Keystrokes typed into the focused terminal -> raw input frames. No local
  // echo: the PTY's echo returns as Output.
  term.onData((data) => sendInput(utf8(data)));

  // Soft-key bar: each data-keys button sends that hex byte sequence as raw input.
  // (clear/exit/compact are wired separately below — they're agent-aware.) On a
  // real keyboard we re-focus the terminal so typing keeps working; on touch we
  // don't (it would pop the on-screen keyboard over the arrows).
  document.querySelectorAll("#softkeys button[data-keys]").forEach((btn) => {
    btn.addEventListener("click", () => {
      sendInput(hexBytes(btn.dataset.keys));
      if (!isTouch) term.focus();
    });
  });

  // Agent-aware command keys. clear/exit adapt to the subscribed pane: a CLI
  // agent (Claude Code) gets the slash form (/clear, /exit), a plain shell gets
  // the bare word. /compact is Claude-only and always sends the slash form.
  // submitCommand appends the delayed Enter; updateCmdLabels (called from
  // renderSelection on every poll/subscribe) keeps the labels on the live form.
  function updateCmdLabels() {
    const agent = currentPaneAgent();
    $("cmd-clear").textContent = agent ? "/clear" : "clear";
    $("cmd-exit").textContent = agent ? "/exit" : "exit";
  }
  function bindCmd(id, fn) {
    $(id).addEventListener("click", () => { fn(); if (!isTouch) term.focus(); });
  }
  // Plain-shell `clear` is realized desktop-side by a grid mutation, not a screen-
  // erase on the PTY stream, so the phone's xterm keeps the stale content. After the
  // clear settles, re-subscribe to pull a fresh snapshot of the now-cleared desktop
  // (the snapshot always mirrors the desktop's true current screen). CLI agents
  // (/clear) repaint their own alt-screen TUI over the live stream, so leave them be.
  bindCmd("cmd-clear", () => {
    const agent = currentPaneAgent();
    submitCommand(agent ? "/clear" : "clear");
    if (!agent && currentPaneId) {
      const pane = currentPaneId;
      setTimeout(() => { if (sameId(pane, currentPaneId)) subscribe(pane); }, 250);
    }
  });
  bindCmd("cmd-exit", () => submitCommand(currentPaneAgent() ? "/exit" : "exit"));
  bindCmd("cmd-compact", () => submitCommand("/compact"));

  // ── Compose bar ("holding pane") ───────────────────────────────────────────
  // Type/paste/edit locally with the native keyboard's full snappiness, then
  // Send pastes the whole block into the pane and submits in one shot. The
  // bracketed-paste decision + the trailing Enter are done server-side (the
  // `paste` request), so multi-line content lands as one paste, not line-by-line.
  function autoGrow() {
    const ta = $("compose-input");
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  }
  // The Send button IS the only Enter now (the soft-key ⏎ became Backspace). With
  // text it pastes the whole block and submits; with the box empty it sends a bare
  // Enter — so you can confirm a Claude prompt / submit a blank line.
  function sendCompose() {
    if (!currentPaneId) return;
    const text = $("compose-input").value;
    if (text) {
      send({ type: "paste", pane_id: currentPaneId, text, submit: true });
      $("compose-input").value = "";
      autoGrow();

    }

  $("compose-input").addEventListener("input", autoGrow);
  $("send-btn").addEventListener("click", sendCompose);

  // ── Touch text-selection → auto-copy ───────────────────────────────────────
  // xterm paints to a canvas, so there's no OS-selectable text. We drive xterm's
  // own selection API from custom touch handlers that mimic the native model:
  // long-press seeds a word + shows two drag handles; dragging a handle extends
  // the selection; releasing a handle copies. Zoom changes xterm's fontSize (not
  // a CSS transform), so the rendered cell geometry stays truthful and mapping a
  // touch point to a grid cell is just screen-rect ÷ cols/rows, offset by the
  // viewport's top buffer line.
  const LP_MS = 450, LP_MOVE_TOL = 10;
  let sel = null;            // { anchor:{col,row}, focus:{col,row} } in buffer coords
  let draggingHandle = null; // "a" | "b" while a handle is under the finger
  let lpTimer = null, lpStart = null, lpMoved = false, toastTimer = null;

  const screenEl = () => $("terminal").querySelector(".xterm-screen");

  function cellMetrics() {
    const sc = screenEl();
    if (!sc || !term.cols || !term.rows) return null;
    const rect = sc.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return { rect, cw: rect.width / term.cols, ch: rect.height / term.rows };
  }
  function cellFromPoint(clientX, clientY) {
    const m = cellMetrics();
    if (!m) return null;
    let col = Math.floor((clientX - m.rect.left) / m.cw);
    let row = Math.floor((clientY - m.rect.top) / m.ch);
    col = Math.max(0, Math.min(term.cols - 1, col));
    row = Math.max(0, Math.min(term.rows - 1, row));
    return { col, row: term.buffer.active.viewportY + row };
  }
  // Pixel position of a cell corner, or null if that buffer row is scrolled out.
  function cellCorner(col, row, rightEdge, bottomEdge) {
    const m = cellMetrics();
    if (!m) return null;
    const vrow = row - term.buffer.active.viewportY;
    if (vrow < 0 || vrow > term.rows) return null;
    return {
      x: m.rect.left + (col + (rightEdge ? 1 : 0)) * m.cw,
      y: m.rect.top + (vrow + (bottomEdge ? 1 : 0)) * m.ch,
    };
  }
  const linIndex = (c) => c.row * term.cols + c.col;

  function applySelection() {
    if (!sel) return;
    let start = sel.anchor, end = sel.focus;
    if (linIndex(start) > linIndex(end)) { start = sel.focus; end = sel.anchor; }
    const length = linIndex(end) - linIndex(start) + 1; // inclusive of the end cell
    try { term.select(start.col, start.row, length); } catch (_) {}
    placeHandles();
    showCopyBtn(true);
  }
  function showCopyBtn(on) { $("copy-btn").classList.toggle("show", !!on); }
  function setHandle(el, p) {
    if (!p) { el.classList.remove("show"); return; }
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.classList.add("show");
  }
  function placeHandles() {
    if (!sel) return;
    setHandle($("sel-a"), cellCorner(sel.anchor.col, sel.anchor.row, false, true));
    setHandle($("sel-b"), cellCorner(sel.focus.col, sel.focus.row, true, true));
  }
  function clearSelectionUI() {
    sel = null;
    draggingHandle = null;
    try { term.clearSelection(); } catch (_) {}

    $("sel-b").classList.remove("show");
    showCopyBtn(false);
  }
  // Expand to the whitespace-delimited word around a cell (single cell on blanks).
  function seedWordAt(cell) {
    const line = term.buffer.active.getLine(cell.row);
    if (!line) return null;
    const text = line.translateToString(false);
    const isWord = (ch) => !!ch && /\S/.test(ch);
    if (!isWord(text[cell.col])) return { anchor: { ...cell }, focus: { ...cell } };
    let s = cell.col, e = cell.col;
    while (s > 0 && isWord(text[s - 1])) s--;
    while (e < term.cols - 1 && isWord(text[e + 1])) e++;

      if (lpMoved || !lpStart) return;

  let pinchDist0 = 0, pinchFont0 = 0;

  // Copying is an explicit tap on the Copy button, which stays up while a

  function startHandle(which, e) {

  // ── Keep the docked bars above the soft keyboard ───────────────────────────

  // no-op rather than a second shrink.
  const vv = window.visualViewport;
  if (vv) {
    const syncViewport = () => {
      document.body.style.height = vv.height + "px";
      if (sel) placeHandles();
    };
    vv.addEventListener("resize", syncViewport);
    vv.addEventListener("scroll", syncViewport);
    syncViewport();
  }

  setInputEnabled(false);
  renderProfileBar();
  loadActiveIntoBuffer();
  setConnState("off");

  // Served (not file://) → connect to the active desktop so the phone URL/QR is
  // zero-tap. file:// (the bundled APK shell) shows the drawer to pick/connect.
  if (window.location.protocol === "http:" || window.location.protocol === "https:") {
    connectProfile(profileStore.active);
  } else {
    openDrawer();
  }
})();
</script>
</body>
</html>
